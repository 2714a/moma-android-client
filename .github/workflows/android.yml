name: Build Android APK (Gradle)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 直接使用 ubuntu-latest Runner 预装的 Android SDK，
      # 避免 android-actions/setup-android@v3 的 sdkmanager 版本冲突。
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ls "$ANDROID_SDK_ROOT" || true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure required SDK components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9 || true
          fi
          chmod +x ./gradlew || true

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moma-android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
